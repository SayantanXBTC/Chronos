name: API CI

on:
  push:
    paths:
      - 'apps/api/**'
  pull_request:
    paths:
      - 'apps/api/**'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e "./apps/api[dev]"

      - name: Run ruff
        run: ruff check app/ tests/
        working-directory: apps/api

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: history_test
          POSTGRES_USER: history
          POSTGRES_PASSWORD: history
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U history"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://history:history@localhost:5432/history_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e "./apps/api[dev]"

      - name: Create postgis/uuid-ossp extensions
        run: |
          PGPASSWORD=history psql -h localhost -U history -d history_test \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run migrations
        run: alembic upgrade head
        working-directory: apps/api

      - name: Run pytest
        run: pytest tests/ -v
        working-directory: apps/api
