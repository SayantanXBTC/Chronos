[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "history-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.0",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"data" = ".", "data.sources" = "sources", "data.entities" = "entities"}
packages = ["data", "data.sources", "data.entities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
